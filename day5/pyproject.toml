[project]
name = "secure-inventory-agent"
version = "0.1.0"
description = "Authenticated inventory risk agent for the AAASE capstone"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4,<4",
    "langchain-openai>=0.3",
    "pydantic>=2.10",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
inventory-agent = "secure_inventory.cli:main"
inventory-mcp = "secure_inventory.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secure_inventory"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
