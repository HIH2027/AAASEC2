[project]
name = "medication-safety-agent"
version = "0.1.0"
description = "Pharmacist-facing drug-drug contraindication checker for the AAASE capstone"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4,<4",
    "langchain-openai>=0.3",
    "pydantic>=2.10",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
medsafety-agent = "medication_safety.cli:main"
medsafety-mcp = "medication_safety.server:main"
medsafety-web = "medication_safety.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medication_safety"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
