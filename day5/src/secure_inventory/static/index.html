<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Secure Lab Inventory Dashboard</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Secure Lab Inventory</h1>
        <p class="subtitle">
          The agent runs on the server. API keys and MCP tokens never reach this page.
        </p>
      </header>

      <section class="controls">
        <fieldset>
          <legend>Recommendation mode</legend>
          <label>
            <input type="radio" name="mode" value="offline" checked />
            Offline (deterministic, no LLM request)
          </label>
          <label>
            <input type="radio" name="mode" value="live" />
            Live AI (OpenRouter, traced in LangSmith)
          </label>
        </fieldset>
        <button id="run">Run analysis</button>
      </section>

      <p id="status" class="status" role="status">Choose a mode and run the analysis.</p>

      <section id="results" hidden>
        <div class="cards">
          <div class="card">
            <span class="card-label">Total value</span>
            <span class="card-value" id="total"></span>
          </div>
          <div class="card">
            <span class="card-label">Low stock items</span>
            <span class="card-value" id="low-count"></span>
          </div>
          <div class="card">
            <span class="card-label">Mode</span>
            <span class="card-value" id="mode-used"></span>
          </div>
        </div>

        <table>
          <thead>
            <tr>
              <th scope="col">Item</th>
              <th scope="col">Qty</th>
              <th scope="col">Unit cost (SAR)</th>
              <th scope="col">Total (SAR)</th>
              <th scope="col">Status</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>

        <div class="recommendation">
          <h2>Restock recommendation</h2>
          <p id="recommendation"></p>
        </div>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
